name: Arcade Android build

on:
  push:
    branches: [main]
    paths:
      - 'public/arcade/**'
      - 'android/arcade/**'
      - '.github/workflows/arcade-android.yml'
  pull_request:
    paths:
      - 'public/arcade/**'
      - 'android/arcade/**'
      - '.github/workflows/arcade-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build offline Android arcade
    # This workflow uses standard public-repository runners; no paid runner is selected.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: bash android/arcade/verify-environment.sh
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.13'
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Lint and build debug APK and unsigned release bundle
        run: gradle -p android/arcade --no-daemon --no-build-cache --console=plain :app:lint :app:assembleDebug :app:bundleRelease
      - name: Verify Android outputs and calculate checksums
        run: python3 android/arcade/verify-artifacts.py
      - name: Upload Android builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transcenlutions-arcade-android-${{ github.sha }}
          path: |
            android/arcade/build/release-artifacts/
            android/arcade/app/build/reports/lint-results-*.html
          if-no-files-found: error
          retention-days: 7
