name: Launch gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s integrations/tay-desktop/tests -v
      - run: node --check integrations/tay-desktop/tay_runtime/queue.js
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run test:identity
      - run: npm run test:workspace
      - run: npm run lint
      - run: npm run smoke
      - run: npm run test:apex
      - run: python -m unittest discover -s tools/apex-flow -p "test_*.py"
      - run: npm run build
