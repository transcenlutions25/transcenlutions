name: Tay Android cloud build

on:
  push:
    branches: [main]
    paths:
      - 'android/tay/**'
      - 'supabase/**'
      - '.github/workflows/tay-android.yml'
  pull_request:
    paths:
      - 'android/tay/**'
      - 'supabase/**'
      - '.github/workflows/tay-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tay-android-cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build native cloud-connected Tay Android
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: bash android/tay/verify-environment.sh
      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.13'
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Lint and build debug APK, unsigned release APK and AAB
        run: gradle -p android/tay --no-daemon --no-build-cache --console=plain :app:lint :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify Android outputs and calculate checksums
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python3 android/tay/verify-artifacts.py
      - name: Include the official APK signing tool for owner-side final signing
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/tay/build/release-artifacts/apksigner.jar
      - name: Upload Tay cloud Android builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tay-cloud-android-${{ github.sha }}
          path: |
            android/tay/build/release-artifacts/
            android/tay/app/build/reports/lint-results-*.html
          if-no-files-found: error
          retention-days: 7
