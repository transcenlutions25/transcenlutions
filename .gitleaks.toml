[extend]
useDefault = true

# Generic-key detection spans two empty template assignments and mistakes the
# NEXT variable's identifier for a value. Allow this exact non-secret only.
[[allowlists]]
description = "Empty environment template variable identifier, not a credential"
condition = "AND"
paths = ['''(^|/)\.env\.example$''']
regexTarget = "secret"
regexes = ['''^ANTHROPIC_API_KEY=$''']


# Supabase publishable keys are intentionally client-visible credentials.
# This pattern allows only the publishable-key prefix; secret/service-role
# credentials remain covered by the default Gitleaks rules.
[[allowlists]]
description = "Supabase publishable client keys"
regexTarget = "secret"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]+'']
