plugins {
    id 'com.android.application'
}

def arcadeWebDirectory = rootProject.file('../../public/arcade')
def generatedAssetsDirectory = layout.buildDirectory.dir('generated/arcadeAssets')
def requiredWebFiles = [
    'index.html', 'arcade.css', 'engine.mjs', 'app.mjs',
    'manifest.webmanifest', 'sw.js', 'icon.svg', 'privacy.html'
]

tasks.register('syncArcadeAssets', Sync) {
    from arcadeWebDirectory
    into generatedAssetsDirectory.map { it.dir('www') }
    include '*.html', '*.css', '*.mjs', '*.js', '*.webmanifest', '*.svg'
    doFirst {
        requiredWebFiles.each { name ->
            if (!new File(arcadeWebDirectory, name).isFile()) {
                throw new GradleException("Missing arcade web asset: ${name}")
            }
        }
    }
}

android {
    namespace 'com.transcenlutions.arcade'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.transcenlutions.arcade'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            debuggable false
            minifyEnabled false
            // Deliberately unsigned. Production signing stays with the owner.
        }
    }

    sourceSets {
        main.assets.srcDir generatedAssetsDirectory
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        // Print every finding in CI, including when lint stops the build.
        textReport true
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncArcadeAssets')
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
