<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tay recovery</title><style>body{font:16px system-ui;background:#130c1d;color:#efe8f6;max-width:760px;margin:60px auto;padding:20px}button,a{color:#f5d591}button{padding:10px;border:1px solid #b08b50;border-radius:10px;background:#302139}section{border:1px solid #735437;border-radius:14px;padding:18px;margin:16px 0}p{line-height:1.6}</style></head><body><h1>Tay recovery</h1><p>This page works independently of Tay’s editable interface. Undo the newest change first. Newer file edits are never overwritten.</p><a href="/">Return to Tay</a><p id="status" role="status"></p><div id="changes"></div><script>
const token='__TOKEN__';async function call(path,data={}){const r=await fetch('/selfdev/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Tay-Token':token},body:JSON.stringify(data)});const v=await r.json();if(v.error)throw Error(v.error);return v;}
async function load(){const s=await call('state');document.getElementById('changes').replaceChildren();for(const p of s.proposals.filter(x=>x.status==='applied')){const row=document.createElement('section');const text=document.createElement('p');text.textContent=p.summary;const b=document.createElement('button');b.textContent='Undo this change';b.onclick=async()=>{b.disabled=true;try{await call('undo',{id:p.id});await load();document.getElementById('status').textContent='Restored. Return to Tay and reload.';}catch(e){document.getElementById('status').textContent=e.message;b.disabled=false;}};row.append(text,b);document.getElementById('changes').append(row);}}load().catch(e=>document.getElementById('status').textContent=e.message);
</script></body></html>
