<style>

input,textarea,select{width:100%;border:1px solid #4d4262;background:#0d0a16;color:var(--text);border-radius:14px;padding:14px;outline:none}textarea{min-height:120px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(238,197,91,.2)}

.error{color:var(--danger);margin-top:12px;white-space:pre-wrap}.success{color:var(--ok);margin-top:12px;white-space:pre-wrap}.row{display:flex;gap:10px}.row>*{flex:1}.progress{height:7px;background:#0d0a16;border-radius:999px;overflow:hidden;margin:18px 0}.progress>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--purple));transition:width .2s ease}
.step-kicker{color:var(--gold);font-size:.84rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.question{font-size:1.55rem;line-height:1.2;margin:.5rem 0}.help{color:var(--muted);line-height:1.5;margin:0 0 14px}
.choice-grid{display:grid;gap:10px;margin-top:14px}.choice{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid #4d4262;background:#100c1c;border-radius:14px}.choice:hover{border-color:#8167a0}.choice input{width:auto;margin-top:3px}.choice span{line-height:1.35}.choice small{display:block;color:var(--muted);margin-top:3px}

.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 40px);overflow:hidden}.sidebar{padding:18px;border-right:1px solid rgba(238,197,91,.2)}.sidebar-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:14px 0}.projects{display:grid;gap:9px}.project{border:1px solid #4a3b62;background:#100c1c;color:var(--text);border-radius:14px;padding:12px;text-align:left}.project.active{border-color:var(--gold);background:#211634}.project strong{display:block}.project small{color:var(--muted)}.main{display:flex;flex-direction:column;min-width:0}.topbar{padding:16px 20px;border-bottom:1px solid rgba(238,197,91,.2);display:flex;justify-content:space-between;gap:12px;align-items:center}.messages{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}.bubble{max-width:82%;padding:14px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#313b8e;border:1px solid #5b72f4}.bubble.tay,.bubble.system{align-self:flex-start;background:#171126;border:1px solid #4c3c62}.composer{padding:16px;border-top:1px solid rgba(238,197,91,.2);display:flex;gap:10px}.composer textarea{resize:none;min-height:54px;max-height:180px}.composer button{width:auto;margin:0;min-width:90px}.empty{padding:30px;color:var(--muted)}.badge{color:var(--gold);font-size:.82rem}

.workspace-nav{display:grid;gap:7px;margin:18px 0}.workspace-nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 12px;border-radius:12px;text-align:left;font-weight:750}.workspace-nav button:hover{background:#130e20;color:var(--text)}.workspace-nav button.active{background:#211634;border-color:rgba(238,197,91,.5);color:var(--gold)}
.project-switch{margin-top:18px;padding-top:14px;border-top:1px solid rgba(238,197,91,.18)}.project-switch .projects{max-height:220px;overflow:auto}.sidebar-actions{display:grid;gap:9px;margin-top:14px}
.workspace{padding:20px;overflow:auto;flex:1}.view-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}.view-head h2{margin:0 0 5px;font-size:1.55rem}.view-head p{margin:0;color:var(--muted)}
.hq-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric,.panel,.agent-card,.task-card,.approval-card,.integration-card,.template-card{background:#100c1c;border:1px solid #443653;border-radius:16px}.metric{padding:15px}.metric strong{display:block;font-size:1.8rem;color:var(--gold)}.metric span{color:var(--muted);font-size:.86rem}
.panel{padding:18px;margin-bottom:14px}.panel h3{margin:0 0 8px}.panel p{color:var(--muted);line-height:1.5}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.lead-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.avatar{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--purple),#2f1f54);display:grid;place-items:center;color:var(--gold);font-weight:900;border:1px solid rgba(238,197,91,.4)}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
.quick-actions{display:flex;flex-wrap:wrap;gap:8px}.quick-actions .secondary{padding:10px 12px}.pill{display:inline-block;border:1px solid #4d4262;background:#181022;border-radius:999px;padding:5px 9px;color:var(--muted);font-size:.78rem}.pill.gold{border-color:rgba(238,197,91,.5);color:var(--gold)}.pill.ok{border-color:rgba(169,240,191,.45);color:var(--ok)}.pill.warn{border-color:rgba(255,159,159,.4);color:var(--danger)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}.kanban-col{min-width:210px}.kanban-col h4{margin:0 0 9px;color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}.task-card{padding:12px;margin-bottom:9px}.task-card strong{display:block;margin-bottom:6px}.task-card p{margin:5px 0 10px;color:var(--muted);font-size:.88rem}.task-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.task-card select{padding:8px;border-radius:10px;font-size:.82rem}
.team-grid,.integration-grid,.template-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.agent-card,.integration-card,.template-card{padding:15px}.agent-card h3,.integration-card h3,.template-card h3{margin:0 0 6px}.agent-card p,.integration-card p,.template-card p{color:var(--muted);font-size:.9rem;line-height:1.45}.agent-actions{display:flex;gap:8px;margin-top:12px}
.approval-list{display:grid;gap:10px}.approval-card{padding:15px}.approval-card h3{margin:0 0 6px}.approval-card p{color:var(--muted);line-height:1.45}.approval-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.inline-form{display:grid;gap:10px}.inline-form .row{align-items:end}.inline-form textarea{min-height:92px}.compact{padding:9px 11px!important;margin:0!important;width:auto!important}.danger-btn{border:1px solid rgba(255,159,159,.45);background:#2b111a;color:#ffd5d5;border-radius:12px;padding:9px 11px;font-weight:800}
.empty-state{padding:24px;border:1px dashed #4d4262;border-radius:16px;color:var(--muted);text-align:center}.workspace-chat{display:flex;flex-direction:column;min-height:calc(100vh - 155px)}.workspace-chat .messages{padding:0 0 16px}.workspace-chat .composer{padding:12px 0 0;border-top:1px solid rgba(238,197,91,.18)}
.integration-catalog{margin-top:18px}.integration-note{font-size:.86rem;color:var(--muted);margin-top:10px}.top-actions{display:flex;gap:8px;align-items:center}.top-actions button{white-space:nowrap}

@media(max-width:760px){.app{padding:0}.auth,.auth.wide{margin:0;min-height:100vh;border-radius:0;padding:24px}.row{display:block}.shell{grid-template-columns:1fr;min-height:100vh;border-radius:0}.sidebar{border-right:0;border-bottom:1px solid rgba(238,197,91,.2);max-height:40vh;overflow:auto}.bubble{max-width:94%}.topbar{padding:12px}.messages{padding:12px}.composer{padding:10px}}
.password-rules{margin:12px 0;color:var(--muted);font-size:.9rem}.password-rules ul{list-style:none;padding:0;margin:8px 0;display:grid;gap:5px}.password-rules [data-met="true"]{color:var(--ok)}.password-match{font-size:.9rem;color:var(--muted);margin:8px 0}
@media(max-width:920px){.hq-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.team-grid,.integration-grid,.template-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.sidebar{max-height:none}.workspace-nav{grid-template-columns:repeat(4,minmax(0,1fr));overflow:auto}.workspace-nav button{text-align:center;font-size:.78rem;padding:9px 7px}.project-switch{display:none}.hq-grid,.team-grid,.integration-grid,.template-grid{grid-template-columns:1fr}.workspace{padding:14px}.view-head{display:block}.top-actions{margin-top:10px}.lead-card{grid-template-columns:auto 1fr}.lead-card>.pill{grid-column:1/-1}.kanban{grid-template-columns:repeat(5,230px)}}
</style>

<body><div id="root" class="app"></div>
<script>
const SUPABASE_URL='https://efmbtmlfqeiaczcqovkb.supabase.co';
const KEY='sb_publishable_A13pR37f9Rg_I2xb-S4LDw_ncmiXqci';
const API=SUPABASE_URL+'/functions/v1/tay-api';
const STORE='transcenlutions_tay_cloud_session_v4';
const DRAFT='transcenlutions_tay_signup_draft_v1';
let session=null,projects=[],activeProject=null,currentView='headquarters',headquarters=null,sessionProfile=null;
let signup={account:{preferred_name:'',email:'',password:''},step:0,answers:null};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({
  preferred_name:'',
  primary_goal:'',
  autonomy_level:'prepare',
  approval_boundaries:{alwaysRequire:['spending','external_messages','publishing','deletion','permissions','contracts'],other:''},
  memory_preferences:{remember:['decisions','projects','preferences','commitments'],neverRetain:''},
  proactivity_preferences:{watchFor:['deadlines','risks','follow_ups','blocked_work','approvals']},
  interruption_preferences:{notifyFor:['urgent_risk','deadline_slip','approval_block']},
  communication_preferences:{style:'adaptive',challengeAssumptions:true,stateUncertainty:true},
  decision_preferences:{optimizeFor:'quality'},
  success_definition:'',
  voice_preference:'ask_first',
  voice_confirm_consequential:true,
  complete:true
});
const spokenPrompts=[
  'What should I help you make true first? Give me the outcome, not a job title or a vague interest.',
  'How far should I move before I check with you?',
  'What actions should always stop for your approval?',
  'What should I remember between sessions, and what should I never retain?',
  'What should I watch for proactively, and when is it worth interrupting you?',
  'How should I communicate with you when work is moving normally?',
  'When tradeoffs are unavoidable, what should I optimize for first?',
  'What must be true before I am allowed to call something done?',
  'When voice guidance is available, how should I guide this kind of setup?'
];
function loadSession(){try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{session=null}}
function saveSession(v){session=v;if(v)localStorage.setItem(STORE,JSON.stringify(v));else localStorage.removeItem(STORE)}
function saveDraft(){localStorage.setItem(DRAFT,JSON.stringify({email:signup.account.email,preferred_name:signup.account.preferred_name,step:signup.step,answers:signup.answers}))}
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT)||'null')}catch{return null}}
function clearDraft(){localStorage.removeItem(DRAFT)}
async function auth(path,body,method='POST',token=''){const h={apikey:KEY,'content-type':'application/json'};if(token)h.authorization='Bearer '+token;const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok){const error=new Error(d.message||d.msg||d.error_description||d.error||d.code||'Authentication failed.');error.status=r.status;throw error}return d}
async function refresh(){if(!session?.refresh_token)throw new Error('Session expired.');const d=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});saveSession(d);return d}
async function api(path,{method='GET',body,retry=true}={}){if(!session?.access_token)throw new Error('Sign in to continue.');let r=await fetch(API+path,{method,headers:{apikey:KEY,authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401&&retry){await refresh();return api(path,{method,body,retry:false})}const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||'Tay request failed.');return d}
function wireEye(password,eye){eye.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';eye.textContent=show?'Hide':'Show';eye.setAttribute('aria-label',show?'Hide password':'Show password');password.focus();password.setSelectionRange(password.value.length,password.value.length)}}
const passwordRules=[
 {id:'length',label:'At least 12 characters',test:v=>Array.from(v).length>=12},
 {id:'upper',label:'One uppercase letter (A–Z)',test:v=>/[A-Z]/.test(v)},
 {id:'lower',label:'One lowercase letter (a–z)',test:v=>/[a-z]/.test(v)},
 {id:'number',label:'One number (0–9)',test:v=>/[0-9]/.test(v)},
 {id:'symbol',label:'One special symbol (such as !, @ or #)',test:v=>/[\p{P}\p{S}]/u.test(v)}
];
function passwordChecklist(){return '<div class="password-rules"><strong>Password requirements</strong><ul id="passwordRequirements">'+passwordRules.map(r=>'<li id="rule-'+r.id+'" data-met="false">○ Required — '+r.label+'</li>').join('')+'</ul><p id="passwordStatus" role="status" aria-live="polite" aria-atomic="true"></p></div>'}
function wirePasswordChecklist(password,confirm){
 password.setAttribute('aria-describedby','passwordRequirements');confirm.setAttribute('aria-describedby','passwordMatch');
 const status=document.getElementById('passwordStatus'),match=document.getElementById('passwordMatch');
 function missing(){return passwordRules.filter(r=>!r.test(password.value))}
 function update(){
  const unmet=missing();for(const rule of passwordRules){const met=rule.test(password.value),row=document.getElementById('rule-'+rule.id);row.dataset.met=String(met);row.textContent=(met?'✓ Met — ':'○ Required — ')+rule.label}
  const summary=(passwordRules.length-unmet.length)+' of '+passwordRules.length+' password requirements met.';if(status.textContent!==summary)status.textContent=summary;
  const matches=password.value.length>0&&password.value===confirm.value;
  const confirmation=confirm.value?(matches?'✓ Passwords match.':'○ Passwords do not match.'):'Confirm your password below.';if(match.textContent!==confirmation)match.textContent=confirmation;
  password.setCustomValidity(unmet.length?'Password still needs: '+unmet.map(r=>r.label).join('; ')+'.':'');
  confirm.setCustomValidity(matches?'':'Passwords do not match.');
 }
 password.addEventListener('input',update);confirm.addEventListener('input',update);update();
 return ()=>{update();const unmet=missing();return unmet.length?'Password still needs: '+unmet.map(r=>r.label).join('; ')+'.':password.value!==confirm.value?'Passwords do not match.':''};
}
function radio(name,value,label,detail,selected){return '<label class="choice"><input type="radio" name="'+name+'" value="'+value+'" '+(selected===value?'checked':'')+'><span><strong>'+label+'</strong>'+(detail?'<small>'+detail+'</small>':'')+'</span></label>'}
function check(name,value,label,selected){return '<label class="choice"><input type="checkbox" name="'+name+'" value="'+value+'" '+(selected.includes(value)?'checked':'')+'><span>'+label+'</span></label>'}
function values(name){return Array.from(document.querySelectorAll('input[name="'+name+'"]:checked')).map(x=>x.value)}
function progress(){return Math.round(((signup.step+1)/spokenPrompts.length)*100)}
function shellStep(title,help,body){return '<section class="auth wide glass" data-spoken-prompt="'+esc(spokenPrompts[signup.step])+'"><div class="brand">TRANSCENLUTIONS</div><div class="progress"><div style="width:'+progress()+'%"></div></div><div class="step-kicker">Tay setup · '+(signup.step+1)+' of '+spokenPrompts.length+'</div><h1 class="question">'+title+'</h1><p class="help">'+help+'</p><form id="intake">'+body+'<div id="notice" class="error"></div><div class="nav"><button id="back" class="secondary" type="button">Back</button><button class="primary" type="submit">'+(signup.step===spokenPrompts.length-1?'Create my Tay':'Continue')+'</button></div></form></section>'}

const OAUTH_CALLBACK='https://transcenlutions25.github.io/transcenlutions/';
let oauthPromise;
function cancelPendingOAuth(){try{sessionStorage.removeItem('tay_oauth_pkce_pending_v1')}catch{}}
function hasPendingOAuth(){try{return Boolean(sessionStorage.getItem('tay_oauth_pkce_pending_v1'))}catch{return false}}
function getOAuth(){
 if(!oauthPromise)oauthPromise=import('./oauth-pkce.mjs').then(({createOAuthController})=>createOAuthController({
  supabaseUrl:SUPABASE_URL,publicKey:KEY,redirectTo:OAUTH_CALLBACK,allowedRedirects:[OAUTH_CALLBACK],
  storage:sessionStorage,crypto:globalThis.crypto,fetch:globalThis.fetch.bind(globalThis)
 }));
 return oauthPromise;
}
async function mountOAuth(){
 const form=document.getElementById('login');if(!form)return;
 const box=document.createElement('div');box.id='socialSignIn';box.setAttribute('aria-live','polite');form.after(box);
 try{
  const oauth=await getOAuth(),enabled=await oauth.providers();if(!box.isConnected||document.getElementById('login')!==form)return;
  if(location.origin!==new URL(OAUTH_CALLBACK).origin){box.textContent='Social sign-in is available only on the approved Tay website.';box.className='muted small';return;}
  const providers=['google','github'].filter(p=>enabled[p]);
  if(!providers.length){box.textContent='Email sign-in is available. Google and GitHub sign-in are not configured yet.';box.className='muted small';return;}
  const hint=document.createElement('p');hint.className='muted small';hint.textContent='Use the same verified email as your existing Tay account. A different email may open a separate account; it does not grant owner access.';box.append(hint);
  let busy=false;
  for(const provider of providers){const button=document.createElement('button');button.type='button';button.className='secondary';button.textContent='Continue with '+(provider==='google'?'Google':'GitHub');box.append(button);
   button.onclick=async()=>{if(busy)return;busy=true;const controls=[...form.querySelectorAll('button'),...box.querySelectorAll('button')];controls.forEach(b=>b.disabled=true);const notice=document.getElementById('notice');notice.className='muted';notice.textContent='Opening secure provider sign-in…';
    try{const url=await oauth.begin(provider);location.assign(url);}catch{notice.className='error';notice.textContent='Provider sign-in could not start. Cancel any pending attempt or use email.';busy=false;controls.forEach(b=>b.disabled=false);}
   };
  }
  const cancel=document.createElement('button');cancel.type='button';cancel.className='linkbtn';cancel.textContent='Cancel pending social sign-in';cancel.onclick=()=>{if(busy)return;oauth.cancel();document.getElementById('notice').textContent='Pending social sign-in cleared. You can try again or use email.';};box.append(cancel);
 }catch{if(box.isConnected){box.className='muted small';box.textContent='Social sign-in is unavailable. Email sign-in and password reset still work.';}}
}

function signInView(message='',email=''){
 root.innerHTML='<section class="auth glass"><div class="brand">TRANSCENLUTIONS</div><h1>Sign in to Tay</h1><p class="muted">One cloud account across Tay web and Android. Your Mac does not need to be running.</p><form id="login"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required value="'+esc(email)+'"></div><div class="field"><label for="password">Password</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" minlength="6" required><button class="eye" id="eye" type="button" aria-label="Show password">Show</button></div></div><div id="notice" class="error">'+esc(message)+'</div><button class="primary" type="submit">Sign in</button><button class="secondary" id="signup" type="button" style="width:100%;margin-top:10px">New here? Set up Tay</button><button class="linkbtn" id="forgot" type="button">Forgot password? Send a reset email</button></form></section>';
 const p=document.getElementById('password'),eye=document.getElementById('eye'),notice=document.getElementById('notice');wireEye(p,eye);
 mountOAuth();
 document.getElementById('signup').onclick=()=>{cancelPendingOAuth();signupAccountView()};
 document.getElementById('login').onsubmit=async e=>{e.preventDefault();notice.className='muted';notice.textContent='Signing in…';try{cancelPendingOAuth();const d=await auth('token?grant_type=password',{email:document.getElementById('email').value.trim(),password:p.value});saveSession(d);await applyDraft();await boot()}catch(x){notice.className='error';notice.textContent=x.message}};
 document.getElementById('forgot').onclick=async()=>{cancelPendingOAuth();const v=document.getElementById('email').value.trim();if(!v){notice.className='error';notice.textContent='Enter your email first.';return}notice.className='muted';notice.textContent='Requesting a reset email…';try{await auth('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email:v});notice.className='success';notice.textContent='Reset email requested. Open the newest password-reset email on this device.'}catch(x){notice.className='error';notice.textContent=x.message}};
}
function signupAccountView(message=''){

 area.innerHTML='<div class="view-head"><div><h2>Tasks</h2><p>Tay can organize and delegate work here. A task is not treated as executed until the runtime actually produces a result.</p></div></div>'+
 '<div class="panel"><div class="panel-head"><h3>Create task</h3><span class="pill gold">Team board</span></div><form id="taskForm" class="inline-form"><div class="row"><div><label>Task</label><input id="taskTitle" maxlength="240" required placeholder="What needs to get done?"></div><div><label>Priority</label><select id="taskPriority"><option>normal</option><option>high</option><option>urgent</option><option>low</option></select></div></div><div><label>Context</label><textarea id="taskDescription" maxlength="4000" placeholder="What should Tay or the specialist know?"></textarea></div><div class="row"><div><label>Assign</label><select id="taskAgent"><option value="">Tay / unassigned</option>'+agents.filter(a=>a.status!=='retired').map(a=>'<option value="'+esc(a.id)+'">'+esc(a.name)+'</option>').join('')+'</select></div><label class="choice" style="margin-top:0"><input id="taskApproval" type="checkbox"><span><strong>Approval before execution</strong><small>Create a human gate before this task can proceed.</small></span></label></div><button class="primary compact" type="submit">Create task</button></form></div>'+
 '<div class="kanban">'+taskColumn('pending','Queued',tasks.filter(t=>t.status==='pending'))+taskColumn('active','In progress',tasks.filter(t=>t.status==='active'))+taskColumn('blocked','Blocked',tasks.filter(t=>t.status==='blocked'))+taskColumn('awaiting_approval','Review',tasks.filter(t=>t.status==='awaiting_approval'))+taskColumn('completed','Done',tasks.filter(t=>t.status==='completed'))+taskColumn('failed','Failed',tasks.filter(t=>t.status==='failed'))+taskColumn('cancelled','Cancelled',tasks.filter(t=>t.status==='cancelled'))+'</div>';
 document.getElementById('taskForm').onsubmit=async e=>{e.preventDefault();const title=document.getElementById('taskTitle').value.trim();if(!title)return;const payload={title,description:document.getElementById('taskDescription').value.trim(),priority:document.getElementById('taskPriority').value,assignedAgentId:document.getElementById('taskAgent').value||null,requiresApproval:document.getElementById('taskApproval').checked};await saveTaskChange('/projects/'+activeProject+'/tasks',payload)};
 area.querySelectorAll('[data-task-status]').forEach(s=>s.onchange=async()=>{await saveTaskChange('/tasks/'+s.dataset.taskStatus,{status:s.value})});
}

async function openInitialView(){
 const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search);
 const authError=hash.has('error')||hash.has('error_code')||query.has('error')||query.has('error_code');
 const recovery=hash.get('type')==='recovery',unsupportedCode=query.has('code');
 let pendingSocialError=false;
 if(!recovery&&authError&&!query.has('code'))pendingSocialError=hasPendingOAuth();
 if(!recovery&&(query.has('code')||pendingSocialError)){
  const callbackUrl=location.href;
  // Remove temporary authorization/error parameters before rendering or awaiting network.
  for(const key of ['code','error','error_code','error_description'])query.delete(key);
  const suffix=query.toString();history.replaceState(null,'',location.pathname+(suffix?'?'+suffix:''));
  try{
   const oauth=await getOAuth();
   if(!oauth.hasPending())throw new Error('This sign-in link did not start in this browser. Start sign-in again here.');
   root.textContent='Completing secure sign-in…';
   const result=await oauth.consume(callbackUrl);saveSession(result.session);await boot();
  }catch{signInView('Social sign-in could not be completed. Start again in this browser, or use your email and password.');}
  return;
 }

 // Keep recovery capabilities in memory, never in the address bar while typing.
 if(authError||recovery||unsupportedCode){
  for(const key of ['code','error','error_code','error_description'])query.delete(key);
  const suffix=query.toString();history.replaceState(null,'',location.pathname+(suffix?'?'+suffix:''));
  if(authError){signInView('This reset link has expired, was already used, or is invalid. Request a new reset email from Tay and open the newest message.');return}
  if(unsupportedCode){signInView('This reset link uses a recovery flow this version of Tay cannot open. Request a new reset email from Tay.');return}
  if(!hash.get('access_token')||!hash.get('refresh_token')){signInView('This password-reset link is incomplete. Request a new reset email from Tay.');return}
  cancelPendingOAuth();recoveryView({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_in:hash.get('expires_in')});return;
 }
 loadSession();if(session?.access_token)boot();else if(query.get('signup')==='1')signupAccountView();else signInView();
}
addEventListener('pageshow',event=>{if(event.persisted&&document.getElementById('login'))signInView('If social sign-in was interrupted, cancel the pending attempt before trying again.');});
openInitialView();
