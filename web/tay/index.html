<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080611">
<title>Tay · Transcenlutions</title>
<style>
:root{color-scheme:dark;--bg:#080611;--panel:#171126;--text:#f7f2ff;--muted:#bfb4d2;--gold:#eec55b;--blue:#3657dd;--purple:#7043c2;--danger:#ff9f9f;--ok:#a9f0bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#25134b 0,transparent 35%),linear-gradient(145deg,#07050d,#0c1128);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:1080px;margin:0 auto;min-height:100vh;padding:20px}.brand{letter-spacing:.18em;color:var(--gold);font-weight:800;font-size:.93rem}.glass{background:rgba(23,17,38,.9);border:1px solid rgba(238,197,91,.35);box-shadow:0 18px 60px rgba(0,0,0,.35);border-radius:22px}.auth{max-width:500px;margin:7vh auto;padding:26px}.muted{color:var(--muted);line-height:1.55}.field{margin-top:16px}.field label{display:block;margin-bottom:7px;font-size:.9rem;font-weight:700}.input-wrap{position:relative}input,textarea{width:100%;border:1px solid #4d4262;background:#0d0a16;color:var(--text);border-radius:14px;padding:14px;outline:none}input:focus,textarea:focus,button:focus-visible{border-color:var(--gold);box-shadow:0 0 0 3px rgba(238,197,91,.2)}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--gold);min-width:52px;min-height:46px;border-radius:12px}.primary,.secondary,.linkbtn{border:0;border-radius:14px;padding:13px 16px;color:#fff;font-weight:800}.primary{background:linear-gradient(100deg,var(--blue),var(--purple));width:100%;margin-top:18px}.secondary{background:#21172f;border:1px solid rgba(238,197,91,.5)}.linkbtn{background:transparent;color:var(--gold);padding:12px 0;width:100%}.error{color:var(--danger);margin-top:12px;white-space:pre-wrap}.success{color:var(--ok);margin-top:12px;white-space:pre-wrap}.shell{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 40px);overflow:hidden}.sidebar{padding:18px;border-right:1px solid rgba(238,197,91,.2)}.sidebar-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:14px 0}.projects{display:grid;gap:9px}.project{border:1px solid #4a3b62;background:#100c1c;color:var(--text);border-radius:14px;padding:12px;text-align:left}.project.active{border-color:var(--gold);background:#211634}.project strong{display:block}.project small{color:var(--muted)}.main{display:flex;flex-direction:column;min-width:0}.topbar{padding:16px 20px;border-bottom:1px solid rgba(238,197,91,.2);display:flex;justify-content:space-between;gap:12px;align-items:center}.messages{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}.bubble{max-width:82%;padding:14px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap}.bubble.user{align-self:flex-end;background:#313b8e;border:1px solid #5b72f4}.bubble.tay,.bubble.system{align-self:flex-start;background:#171126;border:1px solid #4c3c62}.composer{padding:16px;border-top:1px solid rgba(238,197,91,.2);display:flex;gap:10px}.composer textarea{resize:none;min-height:54px;max-height:180px}.composer button{width:auto;margin:0;min-width:90px}.empty{padding:30px;color:var(--muted)}.badge{color:var(--gold);font-size:.82rem}@media(max-width:760px){.app{padding:0}.shell{grid-template-columns:1fr;min-height:100vh;border-radius:0}.sidebar{border-right:0;border-bottom:1px solid rgba(238,197,91,.2);max-height:40vh;overflow:auto}.bubble{max-width:94%}.topbar{padding:12px}.messages{padding:12px}.composer{padding:10px}}
</style>
</head>
<body><div id="root" class="app"></div>
<script>
const SUPABASE_URL='https://efmbtmlfqeiaczcqovkb.supabase.co';
const KEY='sb_publishable_A13pR37f9Rg_I2xb-S4LDw_ncmiXqci';
const API=SUPABASE_URL+'/functions/v1/tay-api';
const STORE='transcenlutions_tay_cloud_session_v3';
let session=null,projects=[],activeProject=null;
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function loadSession(){try{session=JSON.parse(localStorage.getItem(STORE)||'null')}catch{session=null}}
function saveSession(v){session=v;if(v)localStorage.setItem(STORE,JSON.stringify(v));else localStorage.removeItem(STORE)}
async function auth(path,body,method='POST',token=''){const h={apikey:KEY,'content-type':'application/json'};if(token)h.authorization='Bearer '+token;const r=await fetch(SUPABASE_URL+'/auth/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.msg||d.error_description||d.error||d.code||'Authentication failed.');return d}
async function refresh(){if(!session?.refresh_token)throw new Error('Session expired.');const d=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});saveSession(d);return d}
async function api(path,{method='GET',body,retry=true}={}){if(!session?.access_token)throw new Error('Sign in to continue.');let r=await fetch(API+path,{method,headers:{apikey:KEY,authorization:'Bearer '+session.access_token,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401&&retry){await refresh();return api(path,{method,body,retry:false})}const d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||'Tay request failed.');return d}
function wireEye(password,eye){eye.onclick=()=>{const show=password.type==='password';password.type=show?'text':'password';eye.textContent=show?'Hide':'Show';eye.setAttribute('aria-label',show?'Hide password':'Show password');password.focus();password.setSelectionRange(password.value.length,password.value.length)}}
function signInView(message=''){
 root.innerHTML='<section class="auth glass"><div class="brand">TRANSCENLUTIONS</div><h1>Sign in to Tay</h1><p class="muted">Tay Cloud works anywhere over HTTPS. Your Mac does not need to be running.</p><form id="login"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required value="transcenlutions@gmail.com"></div><div class="field"><label for="password">Password</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" minlength="6" required><button class="eye" id="eye" type="button" aria-label="Show password">Show</button></div></div><div id="notice" class="error">'+esc(message)+'</div><button class="primary" type="submit">Sign in</button><button class="linkbtn" id="forgot" type="button">Forgot password? Send a reset email</button></form></section>';
 const p=document.getElementById('password'),eye=document.getElementById('eye'),notice=document.getElementById('notice');wireEye(p,eye);
 document.getElementById('login').onsubmit=async e=>{e.preventDefault();notice.className='muted';notice.textContent='Signing in…';try{const d=await auth('token?grant_type=password',{email:document.getElementById('email').value.trim(),password:p.value});saveSession(d);await boot()}catch(x){notice.className='error';notice.textContent=x.message}};
 document.getElementById('forgot').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){notice.className='error';notice.textContent='Enter your email first.';return}notice.className='muted';notice.textContent='Requesting a reset email…';try{await auth('recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{email});notice.className='success';notice.textContent='Reset email requested. Open the newest password-reset email on this device.'}catch(x){notice.className='error';notice.textContent=x.message}};
}
function recoveryView(tokens){
 root.innerHTML='<section class="auth glass"><div class="brand">TRANSCENLUTIONS</div><h1>Set a new Tay password</h1><p class="muted">Choose a new password for your shared Transcenlutions cloud account.</p><form id="reset"><div class="field"><label for="newPassword">New password</label><div class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><button class="eye" id="eye" type="button" aria-label="Show password">Show</button></div></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></div><div id="notice" class="error"></div><button class="primary" type="submit">Save new password</button></form></section>';
 const p=document.getElementById('newPassword'),c=document.getElementById('confirmPassword'),eye=document.getElementById('eye'),notice=document.getElementById('notice');wireEye(p,eye);
 document.getElementById('reset').onsubmit=async e=>{e.preventDefault();if(p.value!==c.value){notice.textContent='Passwords do not match.';return}notice.className='muted';notice.textContent='Updating password…';try{await auth('user',{password:p.value},'PUT',tokens.access_token);history.replaceState(null,'',location.pathname);saveSession({access_token:tokens.access_token,refresh_token:tokens.refresh_token,expires_in:Number(tokens.expires_in||3600),token_type:'bearer'});notice.className='success';notice.textContent='Password updated. Opening Tay…';setTimeout(()=>boot(),600)}catch(x){notice.className='error';notice.textContent=x.message}};
}
async function boot(){root.innerHTML='<section class="auth glass"><div class="brand">TRANSCENLUTIONS</div><h1>Opening Tay…</h1></section>';try{await api('/session');const d=await api('/projects');projects=Array.isArray(d.projects)?d.projects:[];if(!activeProject&&projects[0])activeProject=projects[0].id;await renderShell()}catch(e){if(/sign in|session|jwt|token|invalid/i.test(e.message)){saveSession(null)}signInView(e.message)}}
async function renderShell(){root.innerHTML='<div class="shell glass"><aside class="sidebar"><div class="brand">TRANSCENLUTIONS</div><div class="sidebar-head"><strong>Projects</strong><button id="newProject" class="secondary">New</button></div><div id="projects" class="projects"></div><button id="logout" class="secondary" style="margin-top:16px;width:100%">Sign out</button></aside><main class="main"><header class="topbar"><div><strong id="projectTitle">Tay Cloud</strong><div class="badge">Cloud connected</div></div><button id="refresh" class="secondary">Refresh</button></header><section id="messages" class="messages"><div class="empty">Choose or create a project.</div></section><form id="composer" class="composer"><textarea id="message" placeholder="Message Tay" required></textarea><button class="primary" type="submit">Send</button></form></main></div>';
 const list=document.getElementById('projects');list.innerHTML=projects.length?projects.map(p=>'<button class="project '+(p.id===activeProject?'active':'')+'" data-id="'+esc(p.id)+'"><strong>'+esc(p.name)+'</strong><small>'+esc(p.summary||'')+'</small></button>').join(''):'<div class="muted">No projects yet.</div>';list.querySelectorAll('.project').forEach(b=>b.onclick=async()=>{activeProject=b.dataset.id;await renderShell()});document.getElementById('newProject').onclick=async()=>{const name=prompt('Project name');if(!name)return;const summary=prompt('What are you building?')||'';try{const d=await api('/projects',{method:'POST',body:{name,summary}});activeProject=d.projectId;projects=(await api('/projects')).projects||[];await renderShell()}catch(e){alert(e.message)}};document.getElementById('logout').onclick=async()=>{try{await api('/session',{method:'DELETE'})}catch{}saveSession(null);signInView()};document.getElementById('refresh').onclick=async()=>{projects=(await api('/projects')).projects||[];await renderShell()};document.getElementById('composer').onsubmit=async e=>{e.preventDefault();if(!activeProject)return;const box=document.getElementById('message');const text=box.value.trim();if(!text)return;box.disabled=true;try{await api('/projects/'+activeProject+'/messages',{method:'POST',body:{text}});box.value='';await loadProject()}catch(x){alert(x.message)}finally{box.disabled=false;box.focus()}};if(activeProject)await loadProject()}
async function loadProject(){try{const d=await api('/projects/'+activeProject);const p=d.project||{};document.getElementById('projectTitle').textContent=p.name||'Tay project';const messages=Array.isArray(d.messages)?d.messages:[];const area=document.getElementById('messages');area.innerHTML=messages.length?messages.map(m=>'<div class="bubble '+esc(m.role)+'">'+esc(m.text)+'</div>').join(''):'<div class="empty">Start the conversation with Tay.</div>';area.scrollTop=area.scrollHeight}catch(e){document.getElementById('messages').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
const hash=new URLSearchParams(location.hash.replace(/^#/,''));
if(hash.get('type')==='recovery'&&hash.get('access_token')){recoveryView({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token'),expires_in:hash.get('expires_in')})}else{loadSession();if(session?.access_token)boot();else signInView()}
</script></body></html>
